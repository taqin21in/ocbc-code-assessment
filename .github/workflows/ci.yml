name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Verify and build the image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Runs the tests and the JaCoCo coverage check: fails below 80% line coverage.
      - name: Verify
        run: ./mvnw -B verify

      - name: Build the Docker image
        run: docker build -f transfer-service/Dockerfile -t transfer-service:ci .
